[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notify"
version = "0.1.0"
description = "阿里云 ECS 日报邮件通知工具（零运行时依赖）"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
notify = "notify.cli:main"

[tool.setuptools]
packages = ["notify", "notify.channels"]
